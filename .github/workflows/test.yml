name: test
on:
  push:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
      - .github/workflows
  pull_request:
    paths-ignore:
      - LICENSE
      - README.*
      - examples
      - .github/workflows
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        nim-version:
          - 'stable'
    steps:
      - uses: actions/checkout@v3

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      # install deps
      - if: runner.os == 'Linux'
        run: 'sudo apt-get install -y libpcre3-dev libpq-dev'

      - if: runner.os == 'Windows'
        run: choco install openssl postgresql --params="/NoServer" -y --no-progress

      - if: runner.os == 'macOS'
        run: brew install libpq openssl

      - run: nimble install -Y
      - run: nim c -r src/${{ github.event.repository.name }}.nim

      - name: Install supranim and init a test project
        run: |
          nimble install supranim -Y
          git config --global user.name "CI"
          supra init testapp --skipconfig --nocache
        env:
          DYLD_LIBRARY_PATH: /usr/local/opt/libpq/lib:$DYLD_LIBRARY_PATH

      - name: Build the test project
        run: nimble build
        working-directory: testapp
        env:
          DYLD_LIBRARY_PATH: /usr/local/opt/libpq/lib:$DYLD_LIBRARY_PATH
